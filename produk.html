<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Produk · kwintakwinta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f2b134'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' font-family='sans-serif' fill='%230f1f2b'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="produk">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

      <header class="page-head">
        <div><h1 id="title">Produk</h1><p class="muted" id="summary"></p></div>
        <button class="btn btn-primary" id="btn-add" type="button">+ Tambah Produk</button>
      </header>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="produk" aria-selected="true">Produk</button>
        <button role="tab" data-tab="customer" aria-selected="false">Customer</button>
      </div>
      <section class="panel">
        <label class="field" style="margin-bottom:14px"><input id="f-q" type="search" placeholder="Cari…" autocomplete="off"></label>
        <div id="list"></div>
      </section>
    </main>
  </div>
  <nav class="bottomnav" id="bottomnav" aria-label="Navigasi utama"></nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <datalist id="unit-list"><option>pcs</option><option>botol</option><option>pak</option><option>kg</option><option>lusin</option><option>box</option></datalist>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>

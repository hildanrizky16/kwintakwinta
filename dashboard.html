<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard · Kwintakwinta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f2b134'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' font-family='sans-serif' fill='%230f1f2b'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body data-page="dashboard">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="page-head">
        <div>
          <h1 id="greeting">Dashboard</h1>
          <p class="muted" id="subtitle"></p>
        </div>
        <a class="btn btn-primary" href="transaksi.html">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Buat Transaksi
        </a>
      </header>

      <section class="overview" aria-label="Ringkasan penjualan">
        <article class="slip" id="slip">
          <div class="slip-label">Total penjualan hari ini</div>
          <div class="slip-amount skeleton" id="stat-today-total">&nbsp;</div>
          <div class="slip-meta" id="slip-meta"></div>
        </article>
        <div class="stats">
          <article class="stat"><span class="stat-label">Jumlah transaksi hari ini</span><strong id="stat-today-count">–</strong></article>
          <article class="stat"><span class="stat-label">Produk terjual hari ini</span><strong id="stat-today-items">–</strong></article>
          <article class="stat"><span class="stat-label">Pendapatan bulan ini</span><strong id="stat-month-total">–</strong></article>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Transaksi terbaru</h2>
          <span><span class="muted small" id="recent-note"></span> <a class="link small" href="riwayat.html">Lihat semua →</a></span>
        </div>
        <div id="recent-wrap"></div>
      </section>

      <footer class="demo-bar" id="demo-bar" hidden>
        <span>Anda sedang melihat data demo. Hapus kapan saja untuk mulai dari nol.</span>
        <button class="btn btn-ghost" id="btn-reset-demo">Reset Data Demo</button>
      </footer>
    </main>
  </div>

  <nav class="bottomnav" id="bottomnav" aria-label="Navigasi utama"></nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
